name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flet Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Global Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=0.25.0"
          pip install -r requirements.txt

      - name: Build APK with Flet
        run: |
          printf 'y\ny\ny\n' | flet build apk --project "FramePlayer" --org "com.frameplayer.app" --product "Frame Player" -vv --no-rich-output 2>&1 | tee flet_build.log

      - name: List Build Outputs
        run: |
          echo "=== BUILD OUTPUT FILES ==="
          find build/ -type f || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FramePlayer-Release-APK
          path: |
            build/**/*.apk
            build/apk/**
            flet_build.log
          retention-days: 14

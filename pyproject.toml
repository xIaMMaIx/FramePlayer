[project]
name = "FramePlayer"
version = "1.0.0"
description = "CarPlay & Tablet YouTube Music Player with Digital Photo Frame"
authors = [{ name = "FramePlayer" }]
# flet packages must match the installed flet-cli (0.86.5); `flet build` installs
# these specs, so an open range pulls a newer flet with a different API.
dependencies = [
    "flet==0.86.5",
    "flet-audio==0.86.5",
    "flet-video==0.86.5",
    "ytmusicapi>=1.12.0",
    "yt-dlp>=2026.10.26",
    "requests>=2.28.0",
    "Pillow>=10.0.0",
    "certifi>=2024.0.0",
]

[tool.flet]
org = "com.frameplayer.app"
product = "Frame Player"
company = "FramePlayer"
copyright = "Copyright (C) 2026"

[tool.flet.app]
# Keep local user data, credentials and dev files out of the APK.
# serious_python matches exact relative paths with the OS separator, so nested
# paths are listed with both "\" (Windows builds) and "/" (Linux/macOS builds).
exclude = [
    ".git",
    ".gitignore",
    "oauth.json",
    "config.json",
    "local_playlist.json",
    "data",
    "build_apk.bat",
    "README.md",
    "config.example.json",
    "__pycache__",
    "src\\__pycache__",
    "src\\services\\__pycache__",
    "src\\ui\\__pycache__",
    "src\\FramePlayer.egg-info",
    "src/__pycache__",
    "src/services/__pycache__",
    "src/ui/__pycache__",
    "src/FramePlayer.egg-info",
]

[tool.flet.android]
# Real devices only (x86_64 is emulator-only), one APK per ABI so each device
# downloads just its own native libs: arm64-v8a for modern phones,
# armeabi-v7a for older 32-bit tablets / car head units.
target_arch = ["arm64-v8a", "armeabi-v7a"]
split_per_abi = true
# Packages run from inside a zip on Android; ytmusicapi opens its gettext .mo
# files via Path(__file__), which fails in the zip and breaks YTMusic() (no search).
extract_packages = ["ytmusicapi"]
adaptive_icon_background = "#0D0E12"

[tool.flet.splash]
color = "#0D0E12"
dark_color = "#0D0E12"

[tool.flet.flutter.pubspec.dependency_overrides]
# The flet 0.86.5 template pins jni 1.0.0, but current shared_preferences_android /
# jni_flutter bindings assert jni ^1.1.0 (same major, so 1.0-era bindings still work).
jni = "^1.1.0"

[tool.flet.android.permission]
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true

"android.permission.READ_MEDIA_IMAGES" = true
"android.permission.READ_MEDIA_VIDEO" = true
"android.permission.READ_MEDIA_AUDIO" = true
